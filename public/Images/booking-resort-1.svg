<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
      <defs>
        <linearGradient id="booking1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#042f2e" />
          <stop offset="100%" stop-color="#0f172a" />
        </linearGradient>
      </defs>
      <rect width="1200" height="700" rx="24" fill="url(#booking1-bg)" />
      <rect x="50" y="50" width="1100" height="600" rx="16" fill="#115e59" fill-opacity="0.2" stroke="#0d9488" stroke-width="2" />
      <!-- Resort UI Header -->
      <text x="90" y="105" fill="#ffffff" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="24">Paradise Cove Resort</text>
      <!-- Search Calendar Box -->
      <rect x="90" y="140" width="1020" height="80" rx="10" fill="#0f172a" stroke="#115e59" stroke-width="2" />
      <!-- Inputs -->
      <text x="120" y="172" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">CHECK IN</text>
      <text x="120" y="200" fill="#ffffff" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="16">Oct 24, 2026</text>
      <line x1="280" y1="155" x2="280" y2="205" stroke="#115e59" />
      <text x="310" y="172" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">CHECK OUT</text>
      <text x="310" y="200" fill="#ffffff" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="16">Oct 29, 2026</text>
      <line x1="470" y1="155" x2="470" y2="205" stroke="#115e59" />
      <text x="500" y="172" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">GUESTS</text>
      <text x="500" y="200" fill="#ffffff" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="16">2 Adults, 1 Child</text>
      <rect x="900" y="160" width="180" height="40" rx="6" fill="#0d9488" />
