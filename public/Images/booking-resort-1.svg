      <rect x="90" y="250" width="485" height="360" rx="12" fill="#0f172a" stroke="#115e59" stroke-width="2" />
      <rect x="110" y="270" width="445" height="180" rx="8" fill="#14b8a6" fill-opacity="0.1" />
      <path d="M 160 380 Q 220 300 280 370 T 400 340 L 400 450 L 160 450 Z" fill="#0d9488" fill-opacity="0.5" />
      <text x="110" y="480" fill="#ffffff" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="22">Oceanfront Deluxe Villa</text>
      <text x="110" y="510" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="15">King Bed • Private Balcony • Free Wi-Fi</text>
      <text x="110" y="575" fill="#14b8a6" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="26">$280<tspan font-size="14" fill="#94a3b8"> / night</tspan></text>
      <rect x="390" y="545" width="165" height="40" rx="6" fill="#0d9488" />
      <text x="445" y="570" fill="#ffffff" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="15">Book Now</text>
      <rect x="625" y="250" width="485" height="360" rx="12" fill="#0f172a" stroke="#115e59" stroke-width="2" />
      <rect x="645" y="270" width="445" height="180" rx="8" fill="#f59e0b" fill-opacity="0.1" />
      <rect x="740" y="300" width="240" height="120" rx="8" fill="#f59e0b" fill-opacity="0.4" />
      <text x="645" y="480" fill="#ffffff" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="22">Tropical Garden Bungalow</text>
      <text x="645" y="510" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="15">Queen Bed • Outdoor Shower • Pool View</text>
      <text x="645" y="575" fill="#14b8a6" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="26">$190<tspan font-size="14" fill="#94a3b8"> / night</tspan></text>
      <rect x="925" y="545" width="165" height="40" rx="6" fill="#0d9488" />
      <text x="980" y="570" fill="#ffffff" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="15">Book Now</text>
