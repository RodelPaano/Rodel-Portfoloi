      <text x="120" y="440" fill="#ffffff" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="20">Payment Details</text>
      <rect x="120" y="465" width="540" height="45" rx="6" fill="#1e293b" stroke="#7c3aed" stroke-width="2" />
      <text x="135" y="493" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="14">4242 •••• •••• 4242</text>
      <rect x="120" y="530" width="260" height="45" rx="6" fill="#1e293b" stroke="#475569" />
