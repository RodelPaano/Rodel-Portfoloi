          <stop offset="0%" stop-color="#0f172a" />
          <stop offset="100%" stop-color="#1e1b4b" />
        </linearGradient>
      </defs>
      <rect width="1200" height="700" rx="24" fill="url(#store2-bg)" />
      <!-- Browser Frame -->
      <rect x="50" y="50" width="1100" height="600" rx="16" fill="#1e293b" stroke="#334155" stroke-width="3" />
