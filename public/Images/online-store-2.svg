      <rect x="400" y="530" width="260" height="45" rx="6" fill="#1e293b" stroke="#475569" />
      <text x="415" y="558" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="14">CVC</text>
      <!-- Summary Panel -->
      <rect x="720" y="210" width="390" height="400" rx="12" fill="#1e1b4b" stroke="#4c1d95" stroke-width="2" />
      <text x="750" y="255" fill="#ffffff" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="22">Order Summary</text>
      <text x="750" y="310" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="16">Smart Watch V2</text>
      <text x="1030" y="310" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="16">$199.99</text>
