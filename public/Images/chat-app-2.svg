<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
      <defs>
        <linearGradient id="chat2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0f172a" />
          <stop offset="100%" stop-color="#1e3a8a" />
        </linearGradient>
      </defs>
      <rect width="1200" height="700" rx="24" fill="url(#chat2-bg)" />
      <!-- Desktop Application Layout simulation -->
      <rect x="50" y="50" width="1100" height="600" rx="16" fill="#0f172a" stroke="#1e3a8a" stroke-width="2" />
      <!-- Sidebar channel lists -->
      <rect x="50" y="50" width="260" height="600" fill="#1e293b" fill-opacity="0.4" />
      <circle cx="85" cy="85" r="18" fill="#3b82f6" />
      <text x="120" y="90" fill="#ffffff" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="16">Rodel Paano</text>
      <!-- Chat Rooms / Channels lists -->
      <text x="80" y="145" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="11">CONVERSATIONS</text>
      <!-- Item active -->
      <rect x="65" y="165" width="230" height="40" rx="6" fill="#3b82f6" fill-opacity="0.2" />
      <circle cx="90" cy="185" r="10" fill="#ec4899" />
      <text x="115" y="190" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="14">Developers Group</text>
      <!-- Other items -->
      <circle cx="90" cy="235" r="10" fill="#a78bfa" />
      <text x="115" y="240" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="14">Client #1 Feedback</text>
      <circle cx="90" cy="285" r="10" fill="#10b981" />
      <text x="115" y="290" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="14">IoT Dashboard Alerts</text>
      <!-- Main channel area -->
      <rect x="310" y="50" width="840" height="600" fill="#0f172a" />
      <rect x="310" y="50" width="840" height="60" fill="#1e293b" stroke="#1e3a8a" />
      <text x="340" y="87" fill="#ffffff" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="18"># Developers Group</text>
      <!-- Messages thread -->
      <circle cx="350" cy="160" r="18" fill="#ec4899" />
      <text x="385" y="155" fill="#ffffff" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="14">Rodel Paano</text>
      <text x="475" y="155" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11">Today at 10:48 AM</text>
      <text x="385" y="180" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="14">Guys, let's deploy the staging server on Node.js using PM2.</text>
      <circle cx="350" cy="240" r="18" fill="#a78bfa" />
      <text x="385" y="235" fill="#ffffff" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="14">Client #1</text>
      <text x="450" y="235" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11">Today at 10:50 AM</text>
      <text x="385" y="260" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="14">Approved. Make sure Firebase database handles session security.</text>
    </svg>