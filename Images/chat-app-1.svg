<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
      <defs>
        <linearGradient id="chat1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0f172a" />
          <stop offset="100%" stop-color="#1e3a8a" />
        </linearGradient>
      </defs>
      <rect width="1200" height="700" rx="24" fill="url(#chat1-bg)" />
      <!-- Mock phone simulator / central console -->
      <rect x="420" y="50" width="360" height="600" rx="36" fill="#0f172a" stroke="#3b82f6" stroke-width="4" />
      <!-- Phone speaker / camera -->
      <rect x="520" y="62" width="160" height="18" rx="9" fill="#1e293b" />
      <!-- Chat App Screen Header -->
      <rect x="420" y="90" width="360" height="60" fill="#1e293b" />
      <circle cx="455" cy="120" r="18" fill="#3b82f6" />
      <text x="448" y="126" fill="#ffffff" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="16">JD</text>
      <text x="485" y="118" fill="#ffffff" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="14">Johnathan Doe</text>
      <text x="485" y="132" fill="#10b981" font-family="Segoe UI, sans-serif" font-size="11">Active Now</text>
      <!-- Chat Bubbles -->
      <!-- Message Left -->
      <rect x="440" y="180" width="220" height="60" rx="14" fill="#1e293b" />
      <text x="455" y="205" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13">Hey Rodel! Did you finish</text>
      <text x="455" y="225" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13">the live chat integration?</text>
      <text x="615" y="255" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="10">10:42 AM</text>
      <!-- Message Right -->
      <rect x="520" y="270" width="220" height="60" rx="14" fill="#3b82f6" />
      <text x="535" y="295" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13">Yes! Express backend and</text>
      <text x="535" y="315" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13">Socket.io are running now.</text>
      <text x="520" y="345" fill="#3b82f6" font-family="Segoe UI, sans-serif" font-size="10">10:44 AM</text>
      <!-- Message Left 2 -->
      <rect x="440" y="360" width="220" height="60" rx="14" fill="#1e293b" />
      <text x="455" y="385" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13">Awesome! Test latency is</text>
      <text x="455" y="405" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13">practically near-zero.</text>
      <text x="615" y="435" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="10">10:45 AM</text>
      <!-- Input Area -->
      <rect x="420" y="570" width="360" height="50" fill="#1e293b" />
      <rect x="440" y="580" width="260" height="30" rx="15" fill="#0f172a" />
      <text x="455" y="600" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">Type a message...</text>
      <circle cx="735" cy="595" r="15" fill="#3b82f6" />
      <polygon points="730,590 742,595 730,600" fill="#ffffff" />
    </svg>