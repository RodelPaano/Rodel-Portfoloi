<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
      <defs>
        <linearGradient id="weather1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#082f49" />
          <stop offset="100%" stop-color="#0f172a" />
        </linearGradient>
        <linearGradient id="chart-grad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4" />
          <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0" />
        </linearGradient>
      </defs>
      <rect width="1200" height="700" rx="24" fill="url(#weather1-bg)" />
      <rect x="50" y="50" width="1100" height="600" rx="16" fill="#0c4a6e" fill-opacity="0.3" stroke="#0ea5e9" stroke-width="2" />
      <!-- Current weather dashboard -->
      <rect x="90" y="90" width="450" height="240" rx="12" fill="#0f172a" fill-opacity="0.6" stroke="#0284c7" />
      <text x="120" y="140" fill="#ffffff" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="28">Borongan City</text>
      <text x="120" y="165" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="16">Eastern Samar, Philippines</text>
      <text x="120" y="250" fill="#ffffff" font-family="Segoe UI, sans-serif" font-weight="300" font-size="72">29°C</text>
      <!-- Sun icon SVG representation -->
      <circle cx="340" cy="210" r="30" fill="#f59e0b" />
      <path d="M340 160v15M340 245v15M290 210h15M365 210h15" stroke="#f59e0b" stroke-width="6" />
      <text x="120" y="295" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-weight="600" font-size="20">Scattered Clouds</text>
      <text x="300" y="295" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="16">Humidity: 78%</text>
      <!-- Charts Panel -->
      <rect x="90" y="360" width="1020" height="260" rx="12" fill="#0f172a" fill-opacity="0.6" stroke="#0284c7" />
      <text x="120" y="400" fill="#ffffff" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="20">24-Hour Temperature Simulation</text>
      <!-- Plotting a nice curve line chart -->
      <path d="M 120 540 Q 240 440 360 480 T 600 450 T 840 500 T 1080 480" fill="none" stroke="#06b6d4" stroke-width="4" />
      <path d="M 120 540 Q 240 440 360 480 T 600 450 T 840 500 T 1080 480 L 1080 580 L 120 580 Z" fill="url(#chart-grad)" />
      <!-- Grid Lines -->
      <line x1="120" y1="580" x2="1080" y2="580" stroke="#1e293b" stroke-width="2" />
      <circle cx="360" cy="480" r="6" fill="#ffffff" stroke="#06b6d4" stroke-width="3" />
      <text x="345" y="460" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12">29°C</text>
      <circle cx="600" cy="450" r="6" fill="#ffffff" stroke="#06b6d4" stroke-width="3" />
      <text x="585" y="430" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12">31°C</text>
      <!-- X-axis Labels -->
      <text x="120" y="605" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">08:00 AM</text>
      <text x="360" y="605" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">12:00 PM</text>
      <text x="600" y="605" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">04:00 PM</text>
      <text x="840" y="605" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">08:00 PM</text>
      <text x="1040" y="605" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">12:00 AM</text>
      <!-- Quick Info Side Cards -->
      <rect x="580" y="90" width="240" height="240" rx="12" fill="#0f172a" fill-opacity="0.6" stroke="#0284c7" />
      <text x="610" y="130" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="14">WIND SPEED</text>
      <text x="610" y="180" fill="#ffffff" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="36">18 km/h</text>
      <text x="610" y="210" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="14">Direction: ENE</text>
      <circle cx="730" cy="200" r="35" fill="none" stroke="#334155" stroke-width="4" />
      <path d="M730 175 L 730 225 M 715 190 L 730 175 L 745 190" fill="none" stroke="#06b6d4" stroke-width="4" />
      <rect x="870" y="90" width="240" height="240" rx="12" fill="#0f172a" fill-opacity="0.6" stroke="#0284c7" />
      <text x="900" y="130" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="14">RAINFALL PROB</text>
      <text x="900" y="180" fill="#ffffff" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="36">65%</text>
      <rect x="900" y="220" width="180" height="15" rx="7" fill="#1e293b" />
      <rect x="900" y="220" width="117" height="15" rx="7" fill="#06b6d4" />
    </svg>