<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
      <defs>
        <linearGradient id="weather2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#082f49" />
          <stop offset="100%" stop-color="#0f172a" />
        </linearGradient>
      </defs>
      <rect width="1200" height="700" rx="24" fill="url(#weather2-bg)" />
      <rect x="50" y="50" width="1100" height="600" rx="16" fill="#0c4a6e" fill-opacity="0.3" stroke="#0ea5e9" stroke-width="2" />
      <!-- Radar Map Simulation -->
      <rect x="90" y="90" width="650" height="520" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#0284c7" />
      <text x="120" y="135" fill="#ffffff" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="20">Eastern Samar Live Doppler Radar</text>
      <!-- Grid pattern for Radar -->
      <circle cx="415" cy="360" r="80" fill="none" stroke="#1e293b" stroke-width="1" />
      <circle cx="415" cy="360" r="160" fill="none" stroke="#1e293b" stroke-width="1" />
      <circle cx="415" cy="360" r="240" fill="none" stroke="#1e293b" stroke-width="1" />
      <line x1="415" y1="120" x2="415" y2="600" stroke="#1e293b" stroke-width="1" />
      <line x1="175" y1="360" x2="655" y2="360" stroke="#1e293b" stroke-width="1" />
      <!-- Simulated radar sweeps / storm cells -->
      <path d="M 350 250 A 120 120 0 0 1 500 320 L 415 360 Z" fill="#22c55e" fill-opacity="0.3" />
      <circle cx="380" cy="270" r="45" fill="#eab308" fill-opacity="0.5" />
      <circle cx="370" cy="260" r="25" fill="#ef4444" fill-opacity="0.6" />
      <!-- Radar Legend -->
      <rect x="630" y="470" width="90" height="120" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="640" y="490" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11">Legend</text>
      <rect x="640" y="505" width="20" height="10" fill="#ef4444" />
      <text x="670" y="515" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11">Heavy</text>
      <rect x="640" y="525" width="20" height="10" fill="#eab308" />
      <text x="670" y="535" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11">Mod</text>
      <rect x="640" y="545" width="20" height="10" fill="#22c55e" />
      <text x="670" y="555" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11">Light</text>
      <!-- Alerts Sidebar -->
      <rect x="770" y="90" width="340" height="520" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#ef4444" />
      <text x="800" y="135" fill="#ef4444" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="20">Active Alerts</text>
      <rect x="800" y="160" width="280" height="100" rx="8" fill="#7f1d1d" fill-opacity="0.4" stroke="#ef4444" />
      <text x="815" y="190" fill="#fca5a5" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="15">RED RAIN ALERT</text>
      <text x="815" y="215" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12">Severe flooding expected in low-lying</text>
      <text x="815" y="235" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12">areas. Stay indoors.</text>
      <rect x="800" y="280" width="280" height="100" rx="8" fill="#78350f" fill-opacity="0.4" stroke="#f59e0b" />
      <text x="815" y="310" fill="#fde68a" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="15">Gale Warning</text>
      <text x="815" y="335" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12">Strong winds up to 60 km/h along</text>
      <text x="815" y="355" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12">coastal waters. Sea travel risky.</text>
    </svg>